    <!-- Matches the theme tokens in src/index.css; ThemeContext keeps the
         active one in sync when the user toggles. -->
    <meta name="theme-color" content="#111110" />

    <!-- Applies the stored/preferred theme before first paint. Without this the
         React effect lands after paint and light-theme users get a dark flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
